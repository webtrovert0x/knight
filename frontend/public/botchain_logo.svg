<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="botchain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="botchain-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Tech Ring -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="url(#botchain-grad)" stroke-width="4" stroke-linejoin="round" fill="rgba(10, 15, 35, 0.9)" />

  <!-- Inner Circuit Grid & Energy Core -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" stroke="url(#botchain-glow)" stroke-width="2" stroke-dasharray="6 3" fill="none" />

  <!-- Central 'BOT' Stylized Node -->
  <path d="M35 32 H 55 C 64 32 68 36 68 42 C 68 47 64 50 57 51 C 65 52 70 56 70 63 C 70 70 64 74 54 74 H 35 V 32 Z M 44 40 V 48 H 53 C 58 48 60 46 60 44 C 60 42 58 40 53 40 H 44 Z M 44 56 V 66 H 55 C 60 66 62 64 62 61 C 62 58 60 56 55 56 H 44 Z" fill="url(#botchain-grad)" filter="url(#glow)" />

  <!-- Orbital Connection Dots -->
  <circle cx="50" cy="6" r="3.5" fill="#00f0ff" />
  <circle cx="88" cy="28" r="3.5" fill="#6366f1" />
  <circle cx="88" cy="72" r="3.5" fill="#a855f7" />
  <circle cx="50" cy="94" r="3.5" fill="#00f0ff" />
  <circle cx="12" cy="72" r="3.5" fill="#6366f1" />
  <circle cx="12" cy="28" r="3.5" fill="#38bdf8" />
</svg>
